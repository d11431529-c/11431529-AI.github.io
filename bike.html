<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台北市 YouBike 附近站點即時看板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f0f4f8;
        }

        .dashboard-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 1rem;
        }

        .card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .btn-query {
            background: #2563eb;
            color: white;
            transition: all 0.3s ease;
        }

        .btn-query:hover {
            background: #1d4ed8;
            transform: scale(1.02);
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        /* 距離標籤樣式 */
        .distance-tag {
            background: #eff6ff;
            color: #1d4ed8;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            border: 1px solid #dbeafe;
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="dashboard-container">
        <!-- Header Section -->
        <header class="text-center mb-10">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-2">
                YouBike 2.0 附近站點
            </h1>
            <p class="text-gray-600 mb-6">根據您的位置顯示最近的 5 個站點</p>
            <button id="fetchBtn" class="btn-query px-8 py-3 rounded-full font-bold shadow-lg flex items-center mx-auto">
                <span id="btnText">尋找最近站點</span>
            </button>
        </header>

        <!-- Status Message -->
        <div id="statusMessage" class="text-center mb-6 hidden">
            <div class="loader"></div>
            <span id="statusText" class="text-blue-600 font-medium">正在取得您的位置...</span>
        </div>

        <!-- Data Display Area -->
        <div id="dataDisplay" class="grid gap-6">
            <div class="text-center text-gray-400 py-20 border-2 border-dashed border-gray-300 rounded-xl">
                請點擊按鈕並允許定位權限
            </div>
        </div>

        <!-- Footer -->
        <footer class="mt-12 text-center text-gray-500 text-sm">
            資料來源：台北市政府政府公開資料平台
        </footer>
    </div>

    <script>
        const API_URL = 'https://tcgbusfs.blob.core.windows.net/dotapp/youbike/v2/youbike_immediate.json';
        const fetchBtn = document.getElementById('fetchBtn');
        const dataDisplay = document.getElementById('dataDisplay');
        const statusMessage = document.getElementById('statusMessage');
        const statusText = document.getElementById('statusText');

        /**
         * 使用 Haversine 公式計算兩點間的距離 (公里)
         */
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // 地球半徑 (km)
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        /**
         * 取得使用者當前位置
         */
        function getUserLocation() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject(new Error('您的瀏覽器不支援定位功能'));
                }
                navigator.geolocation.getCurrentPosition(resolve, reject, {
                    enableHighAccuracy: true,
                    timeout: 5000,
                    maximumAge: 0
                });
            });
        }

        async function initDashboard() {
            // 更新 UI 狀態：開始處理
            statusMessage.classList.remove('hidden');
            statusText.innerText = "正在定位中...";
            fetchBtn.disabled = true;
            fetchBtn.classList.add('opacity-50');

            try {
                // 1. 取得定位座標
                let userCoords = null;
                try {
                    const position = await getUserLocation();
                    userCoords = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };
                } catch (locError) {
                    console.warn('無法取得定位資訊', locError);
                    // 若定位失敗，後續將不會顯示距離標籤
                }

                // 2. 抓取 API 資料
                statusText.innerText = "取得 YouBike 即時資料...";
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('無法取得 API 資料');
                const data = await response.json();

                // 3. 計算距離並排序
                let processedData = data.map(station => {
                    let distance = null;
                    if (userCoords) {
                        distance = calculateDistance(
                            userCoords.lat, 
                            userCoords.lng, 
                            parseFloat(station.latitude), 
                            parseFloat(station.longitude)
                        );
                    }
                    return { ...station, distance };
                });

                // 若有定位資訊，依距離由近到遠排序
                if (userCoords) {
                    processedData.sort((a, b) => a.distance - b.distance);
                }
                
                // 取前 5 筆顯示
                const topFive = processedData.slice(0, 5);
                renderCards(topFive, !!userCoords);

            } catch (error) {
                dataDisplay.innerHTML = `
                    <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded text-red-700">
                        <p class="font-bold">發生錯誤</p>
                        <p>${error.message}</p>
                    </div>
                `;
            } finally {
                statusMessage.classList.add('hidden');
                fetchBtn.disabled = false;
                fetchBtn.classList.remove('opacity-50');
            }
        }

        /**
         * 渲染站點卡片
         */
        function renderCards(stations, hasLocation) {
            if (stations.length === 0) {
                dataDisplay.innerHTML = '<p class="text-center text-gray-500">附近查無站點</p>';
                return;
            }

            dataDisplay.innerHTML = stations.map(station => {
                const cleanName = station.sna.replace('YouBike2.0_', '');
                const currentBikes = station.available_rent_bikes;
                const availableSpaces = station.available_return_bikes;
                
                // 狀態標籤顏色邏輯
                let statusClass = 'bg-green-100 text-green-700';
                if (currentBikes === 0) statusClass = 'bg-red-100 text-red-700';
                else if (currentBikes < 5) statusClass = 'bg-yellow-100 text-yellow-700';

                // 距離顯示邏輯：小於 1km 顯示公尺，大於等於 1km 顯示公里
                let distanceHtml = '';
                if (hasLocation && station.distance !== null) {
                    const distValue = station.distance;
                    const distDisplay = distValue < 1 
                        ? `${Math.round(distValue * 1000)} 公尺` 
                        : `${distValue.toFixed(1)} 公里`;
                    distanceHtml = `<span class="distance-tag">距離約 ${distDisplay}</span>`;
                }

                return `
                    <div class="card p-6 flex flex-col md:flex-row md:items-center justify-between">
                        <div class="mb-4 md:mb-0">
                            <div class="flex items-center flex-wrap gap-2 mb-2">
                                <h3 class="text-xl font-bold text-gray-800">${cleanName}</h3>
                                ${distanceHtml}
                            </div>
                            <p class="text-gray-500 text-sm flex items-center">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                                ${station.ar}
                            </p>
                        </div>
                        <div class="flex items-center space-x-6">
                            <div class="text-center">
                                <span class="block text-2xl font-black text-blue-600">${currentBikes}</span>
                                <span class="text-xs text-gray-400 font-bold">可借</span>
                            </div>
                            <div class="text-center">
                                <span class="block text-2xl font-black text-gray-700">${availableSpaces}</span>
                                <span class="text-xs text-gray-400 font-bold">可還</span>
                            </div>
                            <div class="ml-4">
                                <span class="status-badge ${statusClass}">
                                    ${currentBikes > 0 ? '營運中' : '無車可借'}
                                </span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        fetchBtn.addEventListener('click', initDashboard);
    </script>
</body>
</html>
